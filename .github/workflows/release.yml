name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize runs so two pushes can't race the build counter.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    uses: ./.github/workflows/build.yml

  release:
    name: Publish release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # year.build, resetting the build number when the year changes.
      #
      # The bump is pushed before anything is built: pushing to main is what
      # claims a number, so two queued runs can never publish the same one.
      # Pushes made with GITHUB_TOKEN don't retrigger this workflow; the
      # [skip ci] marker is extra insurance.
      - name: Claim next version
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            # Count from the tip of main: another run may have bumped it since checkout.
            git fetch origin main
            git reset --hard origin/main

            CURRENT_YEAR="$(date +%y)"
            CURRENT="$(sed -n 's|^version=||p' gradle.properties)"
            YEAR="${CURRENT%%.*}"
            BUILD="${CURRENT##*.}"
            if [[ "$YEAR" != "$CURRENT_YEAR" ]]; then
              YEAR="$CURRENT_YEAR"
              BUILD=0
            fi
            BUILD=$((BUILD + 1))
            REVISION="$YEAR.$BUILD"

            sed -i "s|^version=.*|version=$REVISION|" gradle.properties
            # The badge and the jar name users copy out of the README.
            sed -i \
              -e "s|version-[^-]*-blue|version-$REVISION-blue|" \
              -e "s|minesrc-[0-9][0-9.]*\.jar|minesrc-$REVISION.jar|g" \
              -e "s|download/v[0-9][0-9.]*/|download/v$REVISION/|g" \
              README.md

            git add gradle.properties README.md
            git commit -m "build(release): bump version to $REVISION [skip ci]"
            if git push origin HEAD:main; then
              echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
              echo "Releasing MineSrc $REVISION"
              exit 0
            fi
            echo "main moved while claiming $REVISION, retrying (attempt $attempt)"
          done

          echo "::error::could not claim a version after 5 attempts"
          exit 1

      - name: Build the jar
        run: ./gradlew shadowJar --no-daemon --stacktrace

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ steps.version.outputs.revision }}
        run: |
          gh release create "v$REVISION" "build/libs/minesrc-$REVISION.jar" \
            --title "MineSrc $REVISION" \
            --generate-notes \
            --target "$(git rev-parse HEAD)"
